name: Build and audit
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - name: Install pinned Android toolchain
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'ndk;28.2.13676358'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
      - name: Build, JVM tests and lint
        run: ./gradlew :scanner-core:test :scanner-camera:testDebugUnitTest :scanner-sample:assembleDebug :scanner-processing-opencv:assembleDebugAndroidTest :scanner-export:assembleDebugAndroidTest :scanner-sample:assembleDebugAndroidTest lint --console=plain
      - name: Collect dependency evidence
        run: |
          ./gradlew :scanner-sample:writeDependencyInventory --console=plain
          ./gradlew :scanner-sample:dependencies --configuration debugRuntimeClasspath --console=plain > evidence/dependency-graph.txt
          python3 tools/collect_licenses.py
      - name: Audit final APK
        run: |
          python3 tools/audit_release.py --self-test
          python3 tools/audit_release.py
      - name: Save build and test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-and-audit
          retention-days: 14
          path: |
            scanner-sample/build/outputs/apk/debug/*.apk
            **/build/reports/
            **/build/test-results/
            evidence/release-audit.json
