name: Build and audit
on:
  push:
    branches: [main]
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
      - name: Install pinned Android toolchain
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'ndk;28.2.13676358'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Verify OCR native inputs
        run: python3 tools/check_ocr_native.py
      - name: Prepare pinned OCR models for test apps
        run: python3 tools/prepare_ocr_test_models.py
      - name: Build, JVM tests and lint
        run: ./gradlew :scanner-core:test :scanner-ocr-tesseract:testDebugUnitTest :scanner-ocr-tesseract:assembleRelease :scanner-ocr-tesseract:assembleDebugAndroidTest :scanner-camera:testDebugUnitTest :scanner-sample:assembleDebug :scanner-processing-opencv:assembleDebugAndroidTest :scanner-export:assembleDebugAndroidTest :scanner-sample:assembleDebugAndroidTest lint --console=plain
      - name: Collect dependency evidence
        run: |
          ./gradlew :scanner-sample:writeDependencyInventory --console=plain
          ./gradlew :scanner-sample:dependencies --configuration debugRuntimeClasspath --console=plain > evidence/dependency-graph.txt
          python3 tools/collect_licenses.py
      - name: Audit final APK
        run: |
          python3 tools/audit_release.py --self-test
          python3 tools/audit_release.py
      - name: Verify SDK archive and independent consumers
        run: |
          python3 tools/test_package_maven_release.py
          ./gradlew publishAllPublicationsToLocalReleaseRepository --console=plain
          python3 tools/package_maven_release.py
          python3 tools/verify_ocr_consumer.py
      - name: Save build and test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-and-audit
          retention-days: 14
          path: |
            scanner-sample/build/outputs/apk/debug/*.apk
            **/build/reports/
            **/build/test-results/
            evidence/release-audit.json
            evidence/ocr-consumer-validation.json
      - name: Stage the verified stable SDK
        if: github.ref_type == 'tag' && github.event_name == 'push'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stable-sdk
          if-no-files-found: error
          path: |
            release/open-android-doc-scanner-*-sdk-maven.zip
            release/SHA256SUMS

  publish:
    if: github.ref_type == 'tag' && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - name: Publish the verified Maven ZIP and checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name stable-sdk
          archive="open-android-doc-scanner-${version}-sdk-maven.zip"
          test -s "$archive"
          sha256sum --check --strict SHA256SUMS
          unzip -p "$archive" RELEASE-NOTES.md > release-notes.md
          gh release create "$GITHUB_REF_NAME" "$archive" SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --verify-tag --latest \
            --title "Scanner SDK $version" --notes-file release-notes.md
